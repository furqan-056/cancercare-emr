<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .bg-secondary-bg { background-color: #03045e; }
    .text-secondary-text { color: #ffffff; }
    .bg-accent-1 { background-color: #f6673b; }
    .bg-accent-1-hover { background-color: #2563eb; }
    .border-primary-border { border-color: #d1d5db; }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-center items-center bg-secondary-bg">

  <div class="text-center max-w-xl p-6 lg:p-8">

    <h1 class="text-4xl font-bold tracking-tight text-secondary-text mb-2">
      404 - Page Not Found
    </h1>

    <p class="text-sm text-secondary-text mb-6">
      The page you were looking for doesn’t exist. You may have mistyped the address or the page may have moved.
    </p>

    <div class="flex justify-center gap-4">
      <button
        onclick="history.back()"
        class="rounded-xl border border-primary-border
               px-6 py-3 text-sm font-semibold text-secondary-text
               hover:bg-white/10 transition">
        Go Back
      </button>

      <a href="/"
         class="rounded-xl bg-accent-1 px-6 py-3 text-sm font-semibold text-white shadow hover:bg-accent-1-hover transition">
        Go Home
      </a>
    </div>

  </div>

  <div class="mt-12 text-center text-sm text-secondary-text">
    &copy; 2025. All rights reserved.
  </div>

</body>
</html>
